name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Upgrade NPM
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Build Standards (Dependency Level 1)
        run: npm run build -w @holmdigital/standards

      - name: Build Components (Dependency Level 2)
        run: npm run build -w @holmdigital/components

      - name: Build Engine (Dependency Level 3)
        run: npm run build -w @holmdigital/engine

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          # Only use the action for versioning/PR creation
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: OIDC Diagnostic
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+Present}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✅ OIDC System Available"
          else
            echo "❌ OIDC System NOT Available - Check job permissions!"
            exit 1
          fi
          echo "Searching for any .npmrc files..."
          find . -name ".npmrc" -ls

      - name: Publish to NPM (OIDC)
        # Only publish if on master and there are no changeset files left
        if: github.ref == 'refs/heads/master' && steps.changesets.outputs.hasChangesets != 'true'
        run: |
          echo "No changesets found, attempting to publish..."
          
          # DEFINITIVE CLEANUP: Remove ANY .npmrc anywhere in the project
          find . -name ".npmrc" -delete
          rm -f ~/.npmrc
          
          # Ensure npm doesn't use any residual config
          npm config delete @holmdigital:registry
          npm config delete registry
          
          # Diagnostic
          echo "--- NPM CONFIG FINAL CHECK ---"
          npm config list
          echo "------------------------------"
          
          # Record which packages are ACTUALLY published in this run, so the
          # downstream-dispatch step fires only on a fresh publish (not on every
          # master push). Shared with that step via $RUNNER_TEMP.
          PUBLISHED_FILE="$RUNNER_TEMP/freshly-published.txt"
          : > "$PUBLISHED_FILE"

          # Helper function to publish only if version doesn't exist
          publish_if_needed() {
            local pkg_dir=$1
            local pkg_name=$(node -p "require('./$pkg_dir/package.json').name")
            local pkg_version=$(node -p "require('./$pkg_dir/package.json').version")

            echo "Checking if $pkg_name@$pkg_version is already published..."
            if npm view "$pkg_name@$pkg_version" version > /dev/null 2>&1; then
              echo "⚠️ $pkg_name@$pkg_version already exists on NPM, skipping."
            else
              echo "🚀 Publishing $pkg_name@$pkg_version..."
              (cd "$pkg_dir" && npm publish --provenance --access public --registry https://registry.npmjs.org/ --no-workspaces --verbose)
              # Record the package basename (engine/standards/components) as freshly published
              basename "$pkg_dir" >> "$PUBLISHED_FILE"
            fi
          }

          publish_if_needed "packages/standards"
          publish_if_needed "packages/components"
          publish_if_needed "packages/engine"

          echo "--- Freshly published this run ---"; cat "$PUBLISHED_FILE" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # id-token: write permission handles auth via Trusted Publishing

      - name: Trigger downstream deploys
        if: github.ref == 'refs/heads/master' && steps.changesets.outputs.hasChangesets != 'true'
        run: |
          set -euo pipefail

          # Dispatch only for packages ACTUALLY published in this run (recorded
          # by the publish step in $RUNNER_TEMP). This stops every master push
          # from re-dispatching and redeploying the downstream sites — dispatch
          # fires only on a fresh publish. It also supersedes the old npm-view
          # gate: we rely on the publish record, not registry visibility, so
          # there is no propagation race to retry around.
          PUBLISHED_FILE="$RUNNER_TEMP/freshly-published.txt"

          if [ ! -s "$PUBLISHED_FILE" ]; then
            echo "No packages were freshly published this run; nothing to dispatch."
            exit 0
          fi

          dispatch_if_published () {
            local PKG_NAME="$1" EVENT_TYPE="$2" PKG_DIR="$3" TARGETS="$4"
            if ! grep -qxF "${PKG_DIR}" "$PUBLISHED_FILE"; then
              echo "@holmdigital/${PKG_DIR} not freshly published this run, skipping dispatch"
              return 0
            fi
            local VERSION
            VERSION=$(node -p "require('./packages/${PKG_DIR}/package.json').version")
            # Mållistan kommer som mellanslagsseparerad sträng, medveten
            # ociterad i for-loopen så ordlistan delas korrekt.
            for REPO in ${TARGETS}; do
              echo "Dispatching ${EVENT_TYPE} (${VERSION}) to $REPO"
              curl -sf -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
                "https://api.github.com/repos/$REPO/dispatches" \
                -d "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
            done
          }

          # Per-paket-mållista istället för hårdkodad loop. Scan-servern
          # (hetzner-project) konsumerar bara @holmdigital/engine, så den får
          # bara engine-release och inte standards/components-release.
          WEB_WIKI="holmdigital/holmdigital-website holmdigital/accessibility-wiki"

          dispatch_if_published "@holmdigital/engine"     "engine-release"     "engine"     "${WEB_WIKI} holmdigital/hetzner-project"
          dispatch_if_published "@holmdigital/standards"  "standards-release"  "standards"  "${WEB_WIKI}"
          dispatch_if_published "@holmdigital/components" "components-release" "components" "${WEB_WIKI}"
