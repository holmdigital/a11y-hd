name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standards (Dependency Level 1)
        run: npm run build -w @holmdigital/standards

      - name: Build Components (Dependency Level 2)
        run: npm run build -w @holmdigital/components

      - name: Build Engine (Dependency Level 3)
        run: npm run build -w @holmdigital/engine

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          # Only use the action for versioning/PR creation
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: OIDC Diagnostic
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+Present}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✅ OIDC System Available"
          else
            echo "❌ OIDC System NOT Available - Check job permissions!"
            exit 1
          fi
          echo "Searching for any .npmrc files..."
          find . -name ".npmrc" -ls

      - name: Publish to NPM (OIDC)
        # Only publish if on master and there are no changeset files left
        if: github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v 'README.md')" ]; then
            echo "No changesets found, attempting to publish..."
            
            # DEFINITIVE CLEANUP: Remove ANY .npmrc anywhere in the project
            find . -name ".npmrc" -delete
            rm -f ~/.npmrc
            
            # Ensure npm doesn't use any residual config
            npm config delete @holmdigital:registry
            npm config delete registry
            
            # Diagnostic
            echo "--- NPM CONFIG FINAL CHECK ---"
            npm config list
            echo "------------------------------"
            
            # Use isolated publish with forced clean registry and --no-workspaces
            # This is critical to prevent npm from searching for root-level auth
            
            echo "Publishing @holmdigital/standards..."
            (cd packages/standards && npm publish --provenance --access public --registry https://registry.npmjs.org/ --no-workspaces --verbose)
            
            echo "Publishing @holmdigital/components..."
            (cd packages/components && npm publish --provenance --access public --registry https://registry.npmjs.org/ --no-workspaces --verbose)
            
            echo "Publishing @holmdigital/engine..."
            (cd packages/engine && npm publish --provenance --access public --registry https://registry.npmjs.org/ --no-workspaces --verbose)
          else
            echo "Changesets still present, skipping publish step."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # id-token: write permission handles auth via Trusted Publishing
