name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standards (Dependency Level 1)
        run: npm run build -w @holmdigital/standards

      - name: Build Components (Dependency Level 2)
        run: npm run build -w @holmdigital/components

      - name: Build Engine (Dependency Level 3)
        run: npm run build -w @holmdigital/engine

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          # Only use the action for versioning/PR creation
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM (OIDC)
        # Only publish if on master and there are no changeset files left
        if: github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v 'README.md')" ]; then
            echo "No changesets found, attempting to publish..."
            
            # Use direct npm publish for best OIDC/Trusted Publishing compatibility
            # We publish in dependency order: standards -> components -> engine
            
            echo "Publishing @holmdigital/standards..."
            npm publish -w @holmdigital/standards --provenance --access public
            
            echo "Publishing @holmdigital/components..."
            npm publish -w @holmdigital/components --provenance --access public
            
            echo "Publishing @holmdigital/engine..."
            npm publish -w @holmdigital/engine --provenance --access public
          else
            echo "Changesets still present, skipping publish step."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # id-token: write permission handles auth via Trusted Publishing
