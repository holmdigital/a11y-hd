name: Release Wiki

on:
  push:
    tags:
      - 'holmdigital-wiki@*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Wiki
        run: npm run build -w holmdigital-wiki

      - name: Create Artifact
        run: |
          cd holmdigital-wiki/dist
          zip -r ../../wiki-release.zip .

      - name: Create Release
        # SHA-pinnad: tredjeparts-action som skapar releaser med contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: wiki-release.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
