# Dependabot VERSION updates (separate engine from GitHub security updates,
# which run without a config file). This is what keeps ordinary dependencies
# from drifting until someone bumps them by hand (e.g. axe-core 4.12.1).
#
# Noise control: non-major updates are batched into a few grouped PRs per week.
# Major bumps still arrive as individual PRs so they get a deliberate review
# (this repo has been bitten by blind majors — vitest 2->4, esbuild ranges).
version: 2
updates:
  # ---- npm: monorepo workspace. The root lockfile covers engine, components,
  # standards and the root, so a single "/" entry manages all of them. ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # `applies-to` is spelled out on every group now that security groups
      # exist below — the default is version-updates, but leaving it implicit
      # next to an explicit one reads like an oversight.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # ---- Security updates (Intern #49) ----
      # The security-updates engine runs on its own schedule and ignores the
      # version-update groups above, so advisories arrived one PR at a time,
      # mid-week, outside the weekly batch. These groups batch whatever lands
      # together WITHOUT slowing anything down: the engine still opens as soon
      # as an advisory is published, grouping only merges what coincides.
      #
      # Production and development are deliberately separate groups rather than
      # one: a batch that mixes them cannot be triaged (or later auto-merged) as
      # a unit, because a prod dependency of a published package needs a
      # changeset while a dev dependency never reaches consumers.
      security-production:
        applies-to: security-updates
        dependency-type: "production"
      security-development:
        applies-to: security-updates
        dependency-type: "development"
    ignore:
      # React-majors är ett produktbeslut, inte en rutinbump. Engine har
      # react-dom som RUNTIME-dependency (renderToStaticMarkup i
      # reporting/statement-generator.ts) och components har
      # peerDependencies.react-dom ">=18.0.0". En major smalnar av
      # "^18.3.1 || ^19.0.0" och släpper därmed React 18 för konsumenter —
      # en breaking change som kräver changeset + major-bump, inte
      # chore(deps). Se stängd PR #87. Minor/patch inom 18.x/19.x
      # fortsätter grupperas som vanligt.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions: keeps workflow action versions current. We hit the
  # Node-20 action deprecation manually before; this surfaces such bumps. ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
